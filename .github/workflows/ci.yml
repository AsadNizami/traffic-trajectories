name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  deploy:
    # Mirror to the Hugging Face Space once tests pass on main.
    # Needs repo secret HF_TOKEN (HF write token). Optional repo variable HF_SPACE overrides the target Space.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE || 'AsadNizami/traffic-trajectories' }}
        run: |
          [ -n "$HF_TOKEN" ] || { echo "::error::HF_TOKEN secret is empty"; exit 1; }
          [ -n "$HF_SPACE" ] || { echo "::error::HF_SPACE variable is empty (e.g. user/traffic-trajectories)"; exit 1; }
          git lfs install
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main

  deploy-azure:
    # Build the image, push it to ACR and roll the Azure Container App once tests pass on main.
    # One-time setup: deploy/azure-setup.sh, which prints the repo variables to set. Skipped until they exist.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build, push and deploy
        env:
          IMAGE: ${{ vars.AZURE_ACR }}.azurecr.io/${{ vars.AZURE_APP }}:${{ github.sha }}
        run: |
          az extension add --name containerapp --upgrade -y
          az acr login -n "${{ vars.AZURE_ACR }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          az containerapp update -g "${{ vars.AZURE_RG }}" -n "${{ vars.AZURE_APP }}" --image "$IMAGE"
